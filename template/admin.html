<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SGBU - Espace bibliothecaire</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <h1>Bibliotheque Universitaire - Espace bibliothecaire</h1>
    <nav>
        <span id="bienvenue"></span>
        <a href="/catalogue">Catalogue</a>
        <a href="/logout">Se deconnecter</a>
    </nav>
</header>

<main class="container">

    <h2>Tableau de bord</h2>
    <div id="stats">
        <p>Etudiants inscrits : <span id="statEtudiants">-</span></p>
        <p>Ressources au catalogue : <span id="statRessources">-</span></p>
        <p>Emprunts en cours : <span id="statEmprunts">-</span></p>
        <p>Emprunts en retard : <span id="statRetards">-</span></p>
    </div>

    <h2>Ajouter une ressource</h2>
    <form id="formAjoutRessource">
        <label for="titre">Titre :</label>
        <input type="text" id="titre" required>

        <label for="auteur">Auteur :</label>
        <input type="text" id="auteur">

        <label for="type">Type :</label>
        <select id="type">
            <option value="livre">Livre</option>
            <option value="revue">Revue</option>
            <option value="materiel">Materiel</option>
        </select>

        <label for="quantite">Quantite :</label>
        <input type="number" id="quantite" min="1" value="1" required>

        <label for="categorie">Categorie :</label>
        <select id="categorie"></select>

        <button type="submit">Ajouter</button>
    </form>
    <p id="messageAdmin"></p>

    <h2>Tous les emprunts</h2>
    <table id="tableEmpruntsAdmin">
        <thead>
            <tr>
                <th>Utilisateur</th>
                <th>Titre</th>
                <th>Emprunte le</th>
                <th>A retourner avant</th>
                <th>Statut</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="corpsEmpruntsAdmin"></tbody>
    </table>


</main>

<script src="/static/script.js"></script>
</body>
</html>
