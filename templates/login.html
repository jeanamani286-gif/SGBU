<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioUniversité — Connexion</title>
    <link rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            background: #0d1b2a;
        }

        /* ── PANNEAU GAUCHE ── */
        .left-panel {
            position: relative;
            width: 58%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        .left-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(13, 27, 42, 0.72) 0%,
                rgba(13, 27, 42, 0.30) 50%,
                rgba(13, 27, 42, 0.60) 100%
            );
        }

        /* Bandeau bas gauche */
        .left-tagline {
            position: absolute;
            bottom: 48px;
            left: 48px;
            right: 48px;
        }

        .left-tagline .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .left-tagline .eyebrow span {
            display: inline-block;
            width: 36px;
            height: 2px;
            background: #C9A84C;
        }

        .left-tagline .eyebrow p {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #C9A84C;
        }

        .left-tagline h2 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
            text-shadow: 0 2px 16px rgba(0,0,0,0.4);
        }

        .left-tagline h2 em {
            font-style: italic;
            color: #C9A84C;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 48px 52px;
            background: #0d1b2a;
            position: relative;
            overflow: hidden;
        }
        .right-panel::before {
            content: '';
            position: absolute;
            top: -120px;
            right: -120px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .right-panel::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(30,80,160,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .form-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
        }
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 36px;
        }

        .logo-wrap img {
            width: 52px;
            height: 52px;
            border-radius: 12px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text strong {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.03em;
        }

        .logo-text span {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #C9A84C;
            margin-top: 1px;
        }
        .form-header {
            margin-bottom: 32px;
        }

        .form-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .form-header p {
            font-size: 14px;
            color: #8899aa;
            font-weight: 300;
        }
        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #8899aa;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .field input::placeholder {
            color: rgba(255,255,255,0.22);
        }

        .field input:focus {
            border-color: #C9A84C;
            background: rgba(201,168,76,0.06);
        }
        .row-forgot {
            display: flex;
            justify-content: flex-end;
            margin-top: -6px;
            margin-bottom: 24px;
        }

        .row-forgot a {
            font-size: 12px;
            color: #8899aa;
            text-decoration: none;
            transition: color 0.2s;
        }

        .row-forgot a:hover {
            color: #C9A84C;
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1a3a6b 0%, #1e4fa8 100%);
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: opacity 0.2s, transform 0.15s;
            position: relative;
            overflow: hidden;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Séparateur */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        .divider span {
            font-size: 12px;
            color: #556677;
        }
        .register {
            text-align: center;
            font-size: 13px;
            color: #667788;
        }

        .register a {
            color: #C9A84C;
            font-weight: 600;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
        #message {
            min-height: 20px;
            font-size: 13px;
            margin-bottom: 14px;
            border-radius: 6px;
            padding: 0;
            display: none;
        }

        #message.show {
            display: block;
            padding: 10px 14px;
        }

        #message.erreur {
            background: rgba(220,50,50,0.12);
            border: 1px solid rgba(220,50,50,0.3);
            color: #ff7070;
        }

        #message.success {
            background: rgba(50,200,100,0.10);
            border: 1px solid rgba(50,200,100,0.25);
            color: #5dd98a;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .left-panel { width: 100%; height: 240px; }
            .right-panel { padding: 36px 28px; }
            .left-tagline h2 { font-size: 24px; }
        }
    </style>
</head>

            <div class="logo-text">
                <strong>BiblioUniversité</strong>
                <span>SGBU · Portail étudiant</span>
            </div>
        </div>
        <div class="form-header">
            <h1>Bon retour </h1>
            <p>Connectez-vous pour accéder à vos ressources.</p>
        </div>
        <div id="message"></div>
        <form id="formLogin">
            <div class="field">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" placeholder="prenom.nom@universite.fr" required autocomplete="email">
            </div>

            <div class="field">
                <label for="mot_de_passe">Mot de passe</label>
                <input type="password" id="mot_de_passe" name="mot_de_passe" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="row-forgot">
                <a href="#">Mot de passe oublié ?</a>
            </div>

            <button class="btn-login" type="submit">Se connecter</button>
        </form>

        <div class="divider"><span>ou</span></div>

        <p class="register">Pas encore de compte ? <a href="/inscription">Créer un compte</a></p>
    </div>
</div>

<script>
const form = document.getElementById('formLogin');
const msg  = document.getElementById('message');

function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'show ' + type;
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const mdp   = document.getElementById('mot_de_passe').value;
    const btn   = form.querySelector('button[type="submit"]');

    btn.disabled = true;
    btn.textContent = 'Connexion…';
    msg.className = '';

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, mot_de_passe: mdp })
        });

        const data = await res.json();

        if (res.ok && data.succes) {
            showMsg('Connexion réussie ! Redirection…', 'success');
            setTimeout(() => {
                window.location.href = data.role === 'bibliothecaire' ? '/admin' : '/catalogue';
            }, 900);
        } else {
            showMsg(data.erreur || 'Email ou mot de passe incorrect.', 'erreur');
        }
    } catch (err) {
        showMsg('Erreur réseau. Veuillez réessayer.', 'erreur');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Se connecter';
    }
});
</script>
